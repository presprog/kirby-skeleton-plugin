name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  panel:
    name: Panel build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Panel assets
        run: yarn build

      - name: Verify compiled Panel assets
        shell: bash
        run: |
          changes="$(git status --porcelain -- index.js index.css)"

          if [[ -n "$changes" ]]; then
            echo "$changes"
            git diff -- index.js index.css
            echo "Run 'yarn build' and commit the compiled Panel assets." >&2
            exit 1
          fi

  test:
    name: PHP ${{ matrix.php-version }} / Kirby ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.4'
            dependencies: lowest
            suite: tests
          - php-version: '8.4'
            dependencies: latest
            suite: analyze
          - php-version: '8.5'
            dependencies: latest
            suite: tests

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install latest dependencies
        if: matrix.dependencies == 'latest'
        run: composer install --prefer-dist --no-progress

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-plugins

      - name: Install tools for lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer bin all install --prefer-dist --no-progress

      - name: Run ${{ matrix.suite }} suite
        run: composer run-script ${{ matrix.suite }}
